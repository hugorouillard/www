{{ define "main" }}
  <article class="article">
    <a class="back-link" href="{{ .CurrentSection.RelPermalink }}">← {{ .CurrentSection.LinkTitle }}</a>
    <header class="article-header">
      <h1>{{ .Title }}</h1>
      {{ with .Description }}<p>{{ . }}</p>{{ end }}
    </header>
    <div class="prose article-content">
      {{ .Content }}
    </div>
  </article>
{{ end }}

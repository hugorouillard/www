{{ define "main" }}
     <article>
       <header>
         <h1>{{ .Title }}</h1>

         <time datetime="{{ .Date.Format "2006-01-02" }}">
           {{ .Date.Format "2 January 2006" }}
         </time>

         {{ with .Description }}
           <p>{{ . }}</p>
         {{ end }}
       </header>

       {{ .Content }}
     </article>
   {{ end }}

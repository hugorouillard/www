{{ define "main" }}
<section>
    <h1>{{ .Title }}</h1>

    {{ with .Content }} {{ . }} {{ end }}

    <ul>
        {{ range .Pages }}
        {{ $destination := .RelPermalink }}

        {{ with .Params.external_url }}
        {{ $destination = . }}
        {{ end }}

        <li>
            <a href="{{ $destination }}">{{ .LinkTitle }}</a>

            {{ with .Description }}
            <p>{{ . }}</p>
            {{ end }}
        </li>
        {{ end }}
    </ul>
</section>
{{ end }}

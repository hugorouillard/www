<section class="curated-section" aria-labelledby="{{ .id }}">
  <div class="section-heading">
    <h2 id="{{ .id }}">{{ .title }}</h2>
  </div>
  <div class="entry-list">
    {{ range .pages }}
      {{ partial "entry.html" (dict
        "page" .
        "useSummary" $.useSummary
      ) }}
    {{ end }}
  </div>
</section>
